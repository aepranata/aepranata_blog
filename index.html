<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A³-Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F6F7FB;
    --surface: #FFFFFF;
    --surface-2: #EEF0F6;
    --border: #E2E4ED;
    --text: #12141C;
    --text-muted: #565A68;
    --text-dim: #9498A6;
    --accent: #4F46E5;
    --accent-2: #6D63F2;
    --cta: #FF6A3D;
    --cta-2: #FF8158;
    --ok: #17A768;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
  }

  [data-theme="dark"]{
    --bg: #0B0E14;
    --surface: #12151F;
    --surface-2: #171B27;
    --border: #262B38;
    --text: #E4E7F0;
    --text-muted: #9096A3;
    --text-dim: #5B6172;
    --accent: #8B85FF;
    --accent-2: #A39DFF;
    --cta: #FF8158;
    --cta-2: #FF9773;
    --ok: #34D399;
  }

  html{ transition: background .15s ease; }
  body{ transition: background .15s ease, color .15s ease; }

  *{ margin:0; padding:0; box-sizing:border-box; }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  a{ color: inherit; }

  .wrap{
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ---------- NAV ---------- */
  nav{ padding: 28px 0 0; }
  nav .wrap{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-muted);
  }
  .brand{ color: var(--text); font-weight: 700; letter-spacing: 0.02em; }
  .brand span{ color: var(--accent); }

  .nav-right{
    display:flex;
    align-items:center;
    gap: 14px;
  }

  /* ---------- THEME TOGGLE (single circle) ---------- */
  .theme-toggle{
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface-2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    transition: border-color .15s ease, transform .15s ease, background .15s ease;
  }
  .theme-toggle:hover{ border-color: var(--accent); }
  .theme-toggle:active{ transform: scale(0.92); }
  .theme-toggle{ color: var(--text-muted); }
  .theme-toggle:hover{ color: var(--accent); }
  #theme-icon{ display:flex; }
  .lang-btn svg{ display:block; border-radius:50%; }

  /* ---------- LANGUAGE SWITCH (pill) ---------- */
  .lang-switch{
    display:flex;
    align-items:center;
    gap: 2px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
  }
  .lang-btn{
    width: 30px;
    height: 24px;
    border-radius: 999px;
    border: none;
    padding: 0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 15px;
    line-height: 1;
    background: transparent;
    cursor: pointer;
    filter: grayscale(1);
    opacity: 0.4;
    transition: filter .15s ease, opacity .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .lang-btn:hover{ opacity: 0.7; }
  .lang-btn.active{
    filter: grayscale(0);
    opacity: 1;
    background: var(--surface);
    box-shadow: 0 1px 4px rgba(20,20,50,0.12);
  }

  /* ---------- HERO ---------- */
  .hero{ padding: 52px 0 44px; }
  .terminal{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 20px 40px -24px rgba(20,20,50,0.12);
  }
  .terminal-bar{
    display:flex;
    align-items:center;
    gap:8px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }
  .dot{ width:9px; height:9px; border-radius:50%; background: #D3D6E0; }
  .terminal-bar .path{
    margin-left: 10px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
  }
  .terminal-body{
    padding: 20px 20px 24px;
    font-family: var(--mono);
    font-size: 13px;
  }
  .terminal-body .line{
    white-space: pre-wrap;
    opacity: 0;
    color: var(--text-muted);
  }
  .terminal-body .line .prompt{ color: var(--cta); font-weight: 700; }
  .terminal-body .line .hash{ color: var(--accent); font-weight: 600; }
  .terminal-body .line b{ color: var(--text); font-weight: 600; }
  .terminal-body .line .ok{ color: var(--ok); }
  .terminal-body .line.show{ animation: appear .2s ease forwards; }
  .cursor{
    display:inline-block;
    width: 7px;
    height: 14px;
    background: var(--cta);
    vertical-align: -2px;
    animation: blink 1s step-end infinite;
  }
  @keyframes appear{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes blink{ 50%{ opacity:0; } }

  .hero-copy{ margin-top: 28px; }
  .hero-copy .eyebrow{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .hero-copy h1{
    font-family: var(--mono);
    font-weight: 800;
    font-size: clamp(28px, 5vw, 40px);
    line-height: 1.15;
    margin: 10px 0 12px;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .hero-copy p{
    color: var(--text-muted);
    font-size: 15px;
    max-width: 54ch;
  }

  .cta-row{
    display:flex;
    gap: 12px;
    margin-top: 24px;
    flex-wrap: wrap;
  }
  .btn{
    font-family: var(--mono);
    font-size: 13px;
    padding: 12px 18px;
    border-radius: 7px;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap: 8px;
    border: 1px solid transparent;
    cursor: pointer;
    font-weight: 600;
  }
  .btn-primary{
    background: var(--cta);
    color: #fff;
    box-shadow: 0 10px 22px -10px rgba(255,106,61,0.55);
  }
  .btn-primary:hover{ background: var(--cta-2); }
  .btn-ghost{
    border-color: var(--border);
    color: var(--text);
    background: var(--surface);
  }
  .btn-ghost:hover{ border-color: var(--accent); color: var(--accent); }

  /* ---------- LOG / TIMELINE ---------- */
  .log-section{ padding: 44px 0 20px; border-top: 1px solid var(--border); }
  .section-head{
    display:flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .section-head h2{
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }
  .section-head .tag{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
  }

  .month-label{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 26px 0 10px 34px;
    font-weight: 600;
  }
  .month-label:first-child{ margin-top: 22px; }

  .log{
    position: relative;
    min-height: 120px;
  }
  .log::before{
    content: "";
    position: absolute;
    left: 5px;
    top: 6px;
    bottom: 6px;
    width: 1px;
    background: var(--border);
  }

  .entry{
    position: relative;
    display: block;
    padding: 14px 14px 14px 34px;
    margin: 0 -14px;
    text-decoration: none;
    border-radius: 8px;
    transition: background .12s ease;
  }
  .entry:hover{ background: var(--surface); box-shadow: 0 8px 20px -14px rgba(20,20,50,0.18); }
  .entry::before{
    content: "";
    position: absolute;
    left: 15px;
    top: 22px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--text-dim);
    z-index: 2;
  }
  .entry:hover::before{ border-color: var(--accent); }
  .entry.latest::before{ border-color: var(--cta); background: var(--cta); }

  .entry-top{
    display:flex;
    align-items: baseline;
    gap: 10px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .entry-top .hash{ color: var(--accent); font-weight: 600; }

  .entry h3{
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }
  .entry:hover h3{ color: var(--accent); }

  .entry p{
    font-size: 13.5px;
    color: var(--text-muted);
    max-width: 56ch;
  }

  .entry-tags{
    display:flex;
    gap: 8px;
    margin-top: 8px;
  }
  .pill{
    font-family: var(--mono);
    font-size: 10.5px;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--text-dim);
    background: var(--surface);
  }
  .pill.device{ color: var(--text-muted); }
  .pill.ok{ color: var(--ok); border-color: rgba(23,167,104,0.25); background: rgba(23,167,104,0.06); }
  .pill.new{ color: var(--cta); border-color: rgba(255,106,61,0.3); background: rgba(255,106,61,0.06); }

  /* ---------- PAGINATION ---------- */
  .pagination{
    display:flex;
    align-items:center;
    justify-content: center;
    gap: 8px;
    margin: 34px 0 8px;
    font-family: var(--mono);
    font-size: 13px;
  }
  .page-btn{
    min-width: 34px;
    height: 34px;
    padding: 0 10px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    text-decoration:none;
    font-weight: 600;
  }
  .page-btn:hover{ border-color: var(--accent); color: var(--accent); }
  .page-btn.active{ background: var(--accent); border-color: var(--accent); color: #fff; }
  .page-btn[disabled]{ opacity: 0.4; cursor: default; pointer-events:none; }
  .page-btn.nav{ font-size: 15px; }

  /* ---------- FOOTER ---------- */
  footer{
    padding: 32px 0 48px;
    border-top: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
  }
  .footer-links{ display:flex; gap: 18px; margin-bottom: 14px; }
  .footer-links a{ text-decoration:none; color: var(--text-muted); }
  .footer-links a:hover{ color: var(--accent); }

  @media (prefers-reduced-motion: reduce){
    .terminal-body .line{ opacity:1; animation:none; }
    .cursor{ animation:none; }
  }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <div class="brand">A³<span> Project</span></div>
    <div class="nav-right">
      <div id="nav-label">Blog</div>
      <button class="theme-toggle" id="theme-toggle" title="Ganti tema" onclick="toggleTheme()">
        <span id="theme-icon"></span>
      </button>
      <div class="lang-switch">
        <button class="lang-btn" id="lang-id" title="Bahasa Indonesia" onclick="setLang('id')">
          <svg viewBox="0 0 32 32" width="18" height="18" aria-hidden="true">
            <circle cx="16" cy="16" r="16" fill="#fff"/>
            <path d="M0 16a16 16 0 0 1 32 0z" fill="#E70011"/>
          </svg>
        </button>
        <button class="lang-btn" id="lang-en" title="English" onclick="setLang('en')">
          <svg viewBox="0 0 32 32" width="18" height="18" aria-hidden="true">
            <defs><clipPath id="ukClip"><circle cx="16" cy="16" r="16"/></clipPath></defs>
            <g clip-path="url(#ukClip)">
              <rect width="32" height="32" fill="#00247D"/>
              <path d="M0 0L32 32M32 0L0 32" stroke="#fff" stroke-width="6"/>
              <path d="M0 0L32 32M32 0L0 32" stroke="#CF142B" stroke-width="2.4"/>
              <path d="M16 0V32M0 16H32" stroke="#fff" stroke-width="10"/>
              <path d="M16 0V32M0 16H32" stroke="#CF142B" stroke-width="6"/>
            </g>
          </svg>
        </button>
      </div>
    </div>
  </div>
</nav>

<header class="hero">
  <div class="wrap">
    <div class="terminal">
      <div class="terminal-bar">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="path">~/releases</div>
      </div>
      <div class="terminal-body" id="term"></div>
    </div>

    <div class="hero-copy">
      <div class="eyebrow" id="hero-eyebrow">A³-Project</div>
      <h1 id="hero-title">Simple, stable, always evolving.</h1>
      <p id="hero-desc">Temukan berita terbaru, update ROM, dan cerita di balik pengembangan A³-Project.</p>
    </div>

    <div class="cta-row">
      <a href="#log" class="btn btn-primary" id="btn-download">↓ Unduh terbaru</a>
      <a href="https://t.me/a3discussion" class="btn btn-ghost" id="btn-telegram">Gabung Telegram</a>
    </div>
  </div>
</header>

<section class="log-section" id="log">
  <div class="wrap">
    <div class="section-head">
      <h2 id="section-title">Update terbaru</h2>
      <span class="tag" id="entry-count">8 entri</span>
    </div>

    <div class="log" id="log-list"></div>

    <div class="pagination" id="pagination"></div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="footer-links">
      <a href="https://github.com/aepranata">GitHub</a>
      <a href="https://t.me/a3discussion">Telegram</a>
    </div>
    <div id="footer-tagline">ForgeOS — dibangun komunitas, untuk semua perangkat.</div>
  </div>
</footer>

<script>
  /* ---------- I18N ---------- */
  const I18N = {
    id: {
      navLabel: 'Blog',
      eyebrow: 'A³-Project',
      heroTitle: 'Simple, stable, always evolving.',
      heroDesc: 'Temukan berita terbaru, update ROM, dan cerita di balik pengembangan A³-Project.',
      btnDownload: '↓ Cek update',
      btnTelegram: 'Join Telegram →',
      sectionTitle: 'Update terbaru',
      entriesLabel: (n) => n + ' entri',
      footerTagline: 'A³-Project - simple, stable, and evolving',
      termLine: '&gt; memuat update ...',
      loadError: 'Gagal memuat blog. Pastikan koneksi internet tersedia dan server berjalan dengan baik, lalu coba muat ulang halaman.',
      monthsShort: ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'],
      months: ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'],
    },
    en: {
      navLabel: 'Blog',
      eyebrow: 'A³=Project',
      heroTitle: 'Simple, stable, always evolving.',
      heroDesc: 'Discover the latest news, ROM updates, and stories behind the development of A³-Project.',
      btnDownload: '↓ Check updates',
      btnTelegram: 'Join Telegram',
      sectionTitle: 'Latest updates',
      entriesLabel: (n) => n + (n === 1 ? ' entry' : ' entries'),
      footerTagline: 'A³-Project - simple, stable, and evolving.',
      termLine: '&gt; loading updates ...',
      loadError: 'Failed to load the blog. Make sure your internet connection is available and the server is running properly, then try reloading the page.',
      monthsShort: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
      months: ['January','February','March','April','May','June','July','August','September','October','November','December'],
    },
  };

  let currentLang = 'id';
  let currentTheme = 'light';

  const SUN_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
  const MOON_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

  function t(key){ return I18N[currentLang][key]; }

  function applyThemeIcon(){
    document.getElementById('theme-icon').innerHTML = currentTheme === 'dark' ? MOON_SVG : SUN_SVG;
  }

  function toggleTheme(){
    currentTheme = currentTheme === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', currentTheme);
    applyThemeIcon();
  }

  function applyStaticText(){
    document.documentElement.lang = currentLang;
    document.getElementById('nav-label').textContent = t('navLabel');
    document.getElementById('hero-eyebrow').textContent = t('eyebrow');
    document.getElementById('hero-title').textContent = t('heroTitle');
    document.getElementById('hero-desc').textContent = t('heroDesc');
    document.getElementById('btn-download').textContent = t('btnDownload');
    document.getElementById('btn-telegram').textContent = t('btnTelegram');
    document.getElementById('section-title').textContent = t('sectionTitle');
    document.getElementById('footer-tagline').textContent = t('footerTagline');
    document.getElementById('lang-id').classList.toggle('active', currentLang === 'id');
    document.getElementById('lang-en').classList.toggle('active', currentLang === 'en');
    const termLast = document.getElementById('term-last-line');
    if(termLast) termLast.innerHTML = t('termLine');
  }

  function setLang(lang){
    if(lang === currentLang) return;
    currentLang = lang;
    applyStaticText();
    if(posts.length){
      document.getElementById('entry-count').textContent = t('entriesLabel')(posts.length);
      renderPage(currentPage);
    }
  }

  /* ---------- HERO TERMINAL ---------- */
  const lines = [
    { html: '<span class="prompt">$</span> git log --oneline releases', delay: 0 },
    /*{ html: '<span class="hash">a13f2e9</span> <b>v3.2</b> — kamera &amp; power hal <span class="ok">✓</span>', delay: 500 },
    { html: '<span class="hash">7c2b9d1</span> <b>v3.1</b> — hotfix haptic', delay: 800 },
    { html: '<span class="hash">4e8a015</span> <b>v2.0</b> — rosy archived', delay: 1100 },*/
    { html: '&gt; memuat update ...', delay: 1450, id: 'term-last-line' },
  ];
  const term = document.getElementById('term');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    lines.forEach(l => {
      const div = document.createElement('div');
      div.className = 'line show';
      if(l.id) div.id = l.id;
      div.innerHTML = l.html;
      term.appendChild(div);
    });
    const cur = document.createElement('span');
    cur.className = 'cursor';
    term.appendChild(cur);
  } else {
    lines.forEach(l => {
      setTimeout(() => {
        const div = document.createElement('div');
        div.className = 'line';
        if(l.id) div.id = l.id;
        div.innerHTML = l.html;
        term.appendChild(div);
        requestAnimationFrame(() => div.classList.add('show'));
      }, l.delay);
    });
    setTimeout(() => {
      const cur = document.createElement('span');
      cur.className = 'cursor';
      term.appendChild(cur);
    }, 1700);
  }

  /* ---------- BLOG LIST + PAGINATION ---------- */
  // Daftar post TIDAK ditulis manual di sini. Sumbernya adalah posts.json,
  // yang otomatis dibuat oleh build-posts.js dari nama file di folder posts/
  // (format wajib: yyyymmddhhmm.html, contoh: 202608301510.html).
  // Jalankan `node build-posts.js` setiap kali menambah/menghapus post.

  const PER_PAGE = 5;
  let posts = [];
  let totalPages = 1;
  let currentPage = 1;

  async function loadPosts(){
    try{
      const res = await fetch('posts.json', { cache: 'no-store' });
      if(!res.ok) throw new Error('posts.json tidak ditemukan (status ' + res.status + ')');
      posts = await res.json();
    }catch(err){
      document.getElementById('log-list').innerHTML =
        `<p style="font-family:var(--mono);font-size:13px;color:var(--text-dim);padding:16px 0;">${t('loadError')}</p>`;
      document.getElementById('entry-count').textContent = t('entriesLabel')(0);
      return;
    }

    totalPages = Math.max(1, Math.ceil(posts.length / PER_PAGE));
    document.getElementById('entry-count').textContent = t('entriesLabel')(posts.length);
    renderPage(1);
  }

  function formatDate(post){
    const dd = String(post.day).padStart(2, '0');
    return `${dd} ${t('monthsShort')[post.monthIndex]} ${post.year}`;
  }
  function formatMonthLabel(post){
    return `${t('months')[post.monthIndex]} ${post.year}`;
  }

  function renderPage(page){
    currentPage = page;
    const start = (page - 1) * PER_PAGE;
    const pagePosts = posts.slice(start, start + PER_PAGE);

    const list = document.getElementById('log-list');
    list.innerHTML = '';
    let lastMonth = null;

    pagePosts.forEach(post => {
      const monthLabel = formatMonthLabel(post);
      if(monthLabel !== lastMonth){
        const label = document.createElement('div');
        label.className = 'month-label';
        label.textContent = monthLabel;
        list.appendChild(label);
        lastMonth = monthLabel;
      }
      const a = document.createElement('a');
      a.href = post.url;
      a.className = 'entry' + (post.latest ? ' latest' : '');
      a.innerHTML = `
        <div class="entry-top"><span class="hash">#${post.filename.replace('.html','')}</span><span>${formatDate(post)}</span></div>
        <h3>${post.title[currentLang]}</h3>
        <p>${post.excerpt[currentLang]}</p>
        <div class="entry-tags">
          <span class="pill device">${post.device}</span>
          <span class="pill ${post.tagClass}">${post.tag[currentLang]}</span>
        </div>
      `;
      list.appendChild(a);
    });

    renderPagination();
    document.getElementById('log').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
  }

  function renderPagination(){
    const nav = document.getElementById('pagination');
    nav.innerHTML = '';

    const prev = document.createElement('a');
    prev.href = '#';
    prev.className = 'page-btn nav';
    prev.textContent = '‹';
    if(currentPage === 1) prev.setAttribute('disabled', 'true');
    prev.onclick = (e) => { e.preventDefault(); if(currentPage > 1) renderPage(currentPage - 1); };
    nav.appendChild(prev);

    for(let i = 1; i <= totalPages; i++){
      const btn = document.createElement('a');
      btn.href = '#';
      btn.className = 'page-btn' + (i === currentPage ? ' active' : '');
      btn.textContent = i;
      btn.onclick = (e) => { e.preventDefault(); renderPage(i); };
      nav.appendChild(btn);
    }

    const next = document.createElement('a');
    next.href = '#';
    next.className = 'page-btn nav';
    next.textContent = '›';
    if(currentPage === totalPages) next.setAttribute('disabled', 'true');
    next.onclick = (e) => { e.preventDefault(); if(currentPage < totalPages) renderPage(currentPage + 1); };
    nav.appendChild(next);
  }

  applyThemeIcon();
  applyStaticText();
  loadPosts();
</script>

</body>
</html>
